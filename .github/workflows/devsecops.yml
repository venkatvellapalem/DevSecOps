name: Secure CI/CD Pipeline

# This repository is now a *consumer* of its own reusable workflow. It calls
# security-gates.yml exactly the way any other repository would -- there is no
# privileged local copy, so the published interface is the one being dogfooded.
# If the public interface breaks, it breaks here first.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------- the gates
  # Everything portable lives in the reusable workflow: build, hadolint, sast,
  # sca, gitleaks, image-scan, and the failure notification.
  gates:
    name: gates
    uses: $/.github/workflows/security-gates.yml
    with:
      dockerfile: app/Dockerfile
      context: app
      source-path: app
      requirements: app/requirements.txt
      image-name: bcssl-demo-app
    secrets:
      # Optional. Absent = the Slack step is a no-op rather than a failure.
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # -------------------------------------------------------------------- deploy
  # Deliberately NOT in the reusable workflow: publishing is repo-specific. The
  # shared workflow produces a scanned image; only this repository knows where
  # its own image belongs.
  #
  # `needs: gates` is the whole security control. GitHub will not start this job
  # if the called workflow failed. Nothing here re-checks anything.
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs: gates
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      # This is granted HERE, in the caller. GITHUB_TOKEN permissions are not
      # inherited by a reusable workflow -- each caller must opt in.
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image
          path: /tmp

      - name: Load the image that passed every gate
        run: docker load --input /tmp/image.tgz

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Tag and push
        run: |
          # GHCR paths must be lowercase; github.repository preserves the repo's
          # capitalisation and docker rejects it outright otherwise.
          REGISTRY="ghcr.io/${GITHUB_REPOSITORY,,}"
          SHA="${GITHUB_SHA}"

          docker tag "${{ needs.gates.outputs.image-tag }}" "${REGISTRY}:${SHA}"
          docker tag "${{ needs.gates.outputs.image-tag }}" "${REGISTRY}:latest"

          docker push "${REGISTRY}:${SHA}"
          docker push "${REGISTRY}:latest"

          echo "### Pushed" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${REGISTRY}:${SHA}\`" >> "$GITHUB_STEP_SUMMARY"
