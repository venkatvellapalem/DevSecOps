# On-prem runtime for the DevSecOps demo app.
#
# Deploy by digest, not by tag. `latest` is mutable: pulling it an hour later can
# hand you different bytes than the ones CI scanned, and the whole provenance
# claim collapses. deploy/update.sh resolves the tag to a digest and pins it here
# via $DEVSECOPS_IMAGE.
services:
  app:
    image: ${DEVSECOPS_IMAGE:?set DEVSECOPS_IMAGE to image@sha256:... — use deploy/update.sh}
    restart: unless-stopped
    ports:
      - "5000:5000"

    # The image already runs as uid 10001. These three lines mean a compromised
    # process cannot gain anything it did not already have: no setuid escalation,
    # no capabilities at all. The app binds 5000, which needs none.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz').read()"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
